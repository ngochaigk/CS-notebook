site_name: Sổ tay của tôi
site_url: https://TEN_GITHUB.github.io/so-tay/

theme:
  name: material
  language: vi          # giao diện tiếng Việt
  palette:
    # nút chuyển sáng/tối
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Chuyển sang nền tối
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Chuyển sang nền sáng
  features:
    - navigation.instant   # chuyển trang mượt
    - navigation.top       # nút cuộn lên đầu
    - search.highlight     # tô đậm từ khóa tìm kiếm
    - content.code.copy    # nút copy trong khối code

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  
markdown_extensions:
  - admonition             # khối ghi chú đẹp (Note, Warning...)
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

nav:
  - Trang chủ: index.md
  - Python cơ bản:
      - Biến và kiểu dữ liệu: python_co_ban/variable.md
      - Hàm trong Python: python_co_ban/function.md
      - Câu lệnh rẽ nhánh: python_co_ban/branching.md
      - Vòng lặp: python_co_ban/loop.md
      - Cấu trúc dữ liệu: python_co_ban/data_structure.md
      - OOP trong Python: python_co_ban/oop.md
  - Toán cho CS:
      - Softmax và Stable Softmax: math_for_cs/softmax.md
      - Vector và Ma trận: math_for_cs/vector_matrix.md
      - Khoảng tin cậy: math_for_cs/confidence_interval.md
      - Xác suất thống kê:
          - Các khái niệm cơ bản: math_for_cs/prob_stat/basic_define.md
          - Định lý Bayes: math_for_cs/prob_stat/bayes.md
          - Phân phối Gauss: math_for_cs/prob_stat/gaussian.md
          - Khoảng tin cậy: math_for_cs/prob_stat/confidence_interval.md
          - Hàm softmax: math_for_cs/prob_stat/softmax.md
  - Thuật toán:
      - K-Means: algorithms/kmeans.md
      - K-Nearest Neighbors: algorithms/k_nearest_neighbors.md
  - Thư viện trong Python:
      - Numpy: python_library/numpy.md
      - Pandas: python_library/pandas.md
  - Computer Vision:
      - Tổng quan về xử lý ảnh và video: computer_vision/overview.md
      - Truy vấn hình ảnh: computer_vision/image_retrieval.md
  - NLP:
      - Tổng quan về xử lý text và audio: nlp/text_audio.md
